name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: turbofind.exe
            package_dir: turbofind-windows-x86_64
            archive_name: turbofind-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: turbofind
            package_dir: turbofind-linux-x86_64
            archive_name: turbofind-linux-x86_64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: turbofind
            package_dir: turbofind-macos-x86_64
            archive_name: turbofind-macos-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: turbofind
            package_dir: turbofind-macos-aarch64
            archive_name: turbofind-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ matrix.package_dir }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" $packageDir
          Copy-Item "LICENSE" $packageDir
          Copy-Item "README.md" $packageDir
          if (Test-Path "${{ matrix.archive_name }}") {
            Remove-Item "${{ matrix.archive_name }}"
          }
          Compress-Archive -Path "$packageDir/*" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package release archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          package_dir="dist/${{ matrix.package_dir }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$package_dir/"
          chmod +x "$package_dir/${{ matrix.binary_name }}"
          cp LICENSE "$package_dir/"
          cp README.md "$package_dir/"
          tar -czf "${{ matrix.archive_name }}" -C dist "${{ matrix.package_dir }}"

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive_name }}" --repo "$GITHUB_REPOSITORY" --clobber
